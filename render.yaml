envVarGroups:
  - name: timora-shared
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: timora
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_API_URL
        value: https://api.resend.com/emails
      - key: EMAIL_SMTP_FALLBACK
        value: "false"

services:
  - type: web
    name: timora-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - fromGroup: timora-shared
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: APP_DEBUG
        value: "false"

  - type: worker
    name: timora-reminder-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - fromGroup: timora-shared
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: APP_DEBUG
        value: "false"